# 竞赛副本闯关 - Cloudflare Worker 配置
# 一个 Worker 同时托管：网站页面(静态资源) + 搜索后端(/api/*)

name = "comp-dungeon"
main = "worker.js"
compatibility_date = "2026-10-29"

# 静态资源：网站页面放在 site/ 目录，通过 ASSETS 绑定自动托管
[assets]
directory = "./site"
binding = "ASSETS"

# 不写死 routes：域名(comp.niry.cn)由你在 Cloudflare 网页 Domains 标签里手动绑定
