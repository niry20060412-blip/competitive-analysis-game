# 竞赛副本闯关 - Cloudflare Worker 配置
# 一个 Worker 同时托管：网站页面(静态资源) + 搜索后端(/api/*)

name = "comp-dungeon"
main = "worker.js"
compatibility_date = "2026-10-29"

# 绑定到子域名 comp.niry.cn（自定义域名，让静态资源 + API 都统一走 Worker）
# 注意：custom domain 会由 Cloudflare 自动创建 DNS 记录，不能与已有 CNAME 记录冲突
[[routes]]
pattern = "comp.niry.cn"
custom_domain = true
zone_name = "niry.cn"

# 静态资源：网站页面放在 site/ 目录，通过 ASSETS 绑定自动托管
[assets]
directory = "./site"
binding = "ASSETS"
